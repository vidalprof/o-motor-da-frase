<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aprendendo o verbo e a concordância verbal — 4º ano</title>
<meta name="description" content="DESCREVER: o assunto, o ano, quantas folhas e de onde vieram as folhas de papel colhidas.">
<!-- ============================================================
     ESQUELETO DA FOLHA VIVA — a casca, sem conteúdo nenhum.

     ⭐ POR QUE ELE EXISTE (pergunta do Marcos, 15/set/2026): *"mas por que você
     está clonando? Não é melhor colher as atividades da internet com o crivo e
     criar as interatividades que são pedidas, sem clonar?"*
     Ele estava certo sobre o problema. As INTERATIVIDADES nunca foram clonadas
     — o gesto sai do comando impresso na folha de papel. O que se clonava era o
     MOTOR, e junto com ele vinha o CONTEÚDO do caderno de origem: os objetivos
     do relatório, a citação do currículo, o sorteio das folhas, o prefixo das
     figuras, o `var LIGAR`. Na Fábrica de Nomes, CINCO das nove reprovações
     foram exatamente isso, e nenhuma tinha a ver com substantivos.
     Aqui não há o que esquecer de trocar, porque não há nada de ninguém dentro.

     ⚠️ NÃO SE COPIA ESTA PASTA À MÃO: use
        `bash _padrao/nova_folha_viva.sh <pasta> <prefixo> "<Título>"`,
        que carimba o prefixo em todos os lugares de uma vez e roda o pré-voo.

     O QUE JÁ VEM PRONTO, e não se reescreve: navegação e progresso, voz com
     alto-falante em tudo, o teclado de letras nas duas portas (tela e teclado de
     verdade), arrastar com mouse/dedo/caneta, gavetas, ligar, cruzadinha,
     boletim da criança, relatório do professor pela medalha, dossiê pedagógico,
     "continuar de onde parou" por 55 minutos, a chave 1275@ e o aviso ao
     controle da sala quando a criança termina.

     O QUE SE PREENCHE, e está marcado: GESTOS · ITENS · DADOS · NOMES ·
     CURRICULO · novaFolha() · OBJETIVOS (no folhas.js) · as folhas f01..fN.

     ES5 puro, um arquivo (mais o `folhas.js` ao lado), sem biblioteca.
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
:root{
  /* os tokens de cor da folha viva — sem eles o portão `_qa/cor_fixa.py` reprova
     cor de texto cravada, que num tema diferente vira letra invisível */
  --texto:#26201c;
  --texto2:#3a2f27;
  --texto3:#4a3d33;
  /* ⚠️ IDENTIDADE PRÓPRIA (Marcos, 18/set/2026: "cada caderno precisa ter capa
     diferente, cor diferente, animações"): este cinza é de ESQUELETO —
     CINZA DE ESQUELETO — TROCAR pela cor do ASSUNTO do caderno novo (`_padrao/identidade_capa.py`). O portão 0b11 (`_qa/identidade.py`)
     reprova cor, capa ou animação iguais às de qualquer outro caderno ou ao esqueleto. */
  --cor:#00695c;
  --cor2:#004c42;
  --corclara:#e0edeb;
}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f4efe9;color:var(--texto);padding-bottom:160px}
#topo{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--cor);
  box-shadow:0 2px 14px rgba(70,40,20,.13);padding:8px 10px;display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto}
#topo .tit{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:12px;background:#eee3d9;border-radius:8px;overflow:hidden;flex:1;min-width:60px;max-width:200px}
.prog i{display:block;height:100%;width:0;background:var(--cor);border-radius:8px;-webkit-transition:width .5s;transition:width .5s}
.pg{font-weight:800;font-size:14px;color:var(--cor2);white-space:nowrap}
button{font-family:inherit;cursor:pointer}
.bt{min-width:48px;min-height:48px;border:0;border-radius:16px;background:var(--cor);color:#fff;font-weight:800;font-size:17px;
  padding:10px 18px;box-shadow:0 4px 0 var(--cor2);-webkit-transition:transform .08s;transition:transform .08s}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cor2)}
.bt[disabled]{opacity:.45;cursor:default;box-shadow:none}
.bt.cinza{background:#eae2da;color:#57493f;box-shadow:0 4px 0 #cdc0b4}
.bt.verde{background:#15a34a;box-shadow:0 4px 0 #0d7736}
.zap{width:42px;height:42px;border-radius:50%;border:0;background:var(--cor);box-shadow:0 3px 0 var(--cor2);
  display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.zap svg{width:22px;height:22px;fill:#fff}
.zap.off{background:#c2b6ab;box-shadow:0 3px 0 #a3968b}
.zap.ouvir{background:#fff;box-shadow:0 3px 0 #ddd0c4;border:2px solid var(--cor)}
.zap.ouvir svg{fill:var(--cor)}
.zap.ouvir.tocando{-webkit-animation:pulsa 1s infinite;animation:pulsa 1s infinite}
@-webkit-keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

#livro{max-width:880px;margin:12px auto 0;padding:0 10px}
.pagina{position:relative;background:#fff;border-radius:22px;box-shadow:0 10px 34px rgba(70,40,20,.16);display:none;overflow:hidden;padding:0 0 20px}
.pagina.viva{display:block;-webkit-animation:entra .35s ease-out;animation:entra .35s ease-out}
@-webkit-keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.faixa{background:var(--cor);color:#fff;padding:15px 18px 13px;display:flex;align-items:center;gap:12px}
.faixa h2{margin:0;font-size:clamp(17px,4.4vw,25px);letter-spacing:.4px;text-transform:uppercase;flex:1;line-height:1.1}
.faixa .num{background:#fff;color:var(--cor);font-weight:900;border-radius:50%;width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex:none}
/* uma cor por BLOCO da escada — a criança vê que mudou de assunto */
.pagina.c1 .faixa{background:#00695c}.pagina.c1 .faixa .num{color:#00695c}
.pagina.c2 .faixa{background:#1179bf}.pagina.c2 .faixa .num{color:#1179bf}
.pagina.c3 .faixa{background:#15803d}.pagina.c3 .faixa .num{color:#15803d}
.pagina.c4 .faixa{background:#8b5cf6}.pagina.c4 .faixa .num{color:#8b5cf6}
.pagina.c5 .faixa{background:#b45309}.pagina.c5 .faixa .num{color:#b45309}
.enun{margin:14px 16px 4px;font-size:clamp(15px,3.9vw,19px);font-weight:700;line-height:1.35}
.enun b{color:var(--cor2)}

.item{margin:12px 14px;padding:14px;border:2px solid #f0e6dd;border-radius:20px;background:#fffdfb}
.item.feito{border-color:#bfe6ce;background:#f3fcf6}
.item .n{font-weight:900;color:#b3a294;font-size:15px;margin-right:8px}
/* ⚠️ A FIGURA TEM ALTURA FIXA: com `height:auto` cada figura entrava no seu
   tamanho natural (o prédio com 230 px e o tijolo com 90) e, como `display:block`
   ignora o `text-align:center` do pai, todas encostavam na esquerda. */
.fig{display:block;width:auto;height:clamp(76px,19vw,116px);max-width:100%;
  margin:2px auto 6px;object-fit:contain;image-rendering:auto}
.figgrande{display:block;width:auto;height:clamp(84px,21vw,128px);max-width:100%;
  margin:0 auto;object-fit:contain}
.figbt{border:0;background:none;padding:4px;border-radius:16px;min-width:48px;min-height:48px}
/* ⚠️ O ALTO-FALANTE É DESENHADO EM CSS — caixinha + triângulo + duas ondas de
   borda arredondada. Nada de emoji (vira quadradinho nos PCs da escola) e nada
   de SVG solto (ordem do Marcos, set/2026). */
.som{position:relative;width:46px;height:46px;min-width:46px;border:3px solid var(--cor);
  border-radius:50%;background:var(--corclara);padding:0;cursor:pointer;flex:none}
.som:active{-webkit-transform:scale(.93);transform:scale(.93)}
.som .cone{position:absolute;left:12px;top:17px;width:7px;height:10px;background:var(--cor2);
  border-radius:2px 0 0 2px}
.som .cone:after{content:"";position:absolute;left:6px;top:-6px;width:0;height:0;
  border-top:11px solid transparent;border-bottom:11px solid transparent;
  border-right:11px solid var(--cor2)}
.som .onda{position:absolute;border:3px solid var(--cor2);border-left-color:transparent;
  border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}
.som .o1{left:26px;top:16px;width:8px;height:12px}
.som .o2{left:29px;top:11px;width:13px;height:22px;opacity:.65}
/* ⚠️ A LINHA DO ENUNCIADO TEM DE QUEBRAR (19/set/2026, achado pela regra 5b).
   Sem `flex-wrap`, quando o texto ao lado é comprido o ALTO-FALANTE é empurrado
   para fora da tela — no `_nasal2`, folha 7, ele saía 47 px além da borda num
   celular pequeno, e a criança que não sabe ler ficava sem o botão que existe
   justamente para ela. Com wrap ele desce uma linha e continua ali. */
.enunlin{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 2px}
.enunlin .enun{flex:1;min-width:0}

/* fileira genérica de opções */
.ops{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
/* ⚠️ O ALTO-FALANTE DA RESPOSTA — DISCRETO, e é regra do Marcos (20/set/2026):
   *"o alto-falante discreto para clicar caso o estudante queira ouvir"*. Ele
   vem AO LADO de cada opção, antes da escolha, para quem ainda não lê.
   ⚠️ 42 px e não menos: o portão de leiaute reprova alvo abaixo de 40 px, e
   dedo de criança não acerta menor que isso. "Discreto" aqui é a BORDA clara e
   a opacidade, não o tamanho. */
/* ⚠️ `wrap` e `max-width` NÃO são enfeite: sem eles a opção + o alto-falante
   passavam 20 px da tela do celular no `_reinos` (folha 25), e o portão de
   leiaute pegou — alvo cortado na beira é alvo que a criança não alcança.
   Com `wrap`, quando não cabe lado a lado o alto-falante desce para baixo
   da resposta em vez de empurrá-la para fora. */
.opw{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%}
.opw.larga{width:100%;max-width:440px}
.opw.larga .op.frase{flex:1;width:auto;max-width:none}
.som.somop{width:42px;height:42px;min-width:42px;border-width:2px;
  border-color:#e3d6ce;opacity:.85}
.som.somop:active{opacity:1}
.som.somop .cone{left:11px;top:15px}
.som.somop .o1{left:24px;top:14px}
.som.somop .o2{left:27px;top:9px}

.op{min-width:64px;min-height:56px;border:3px solid #e6dbd1;border-radius:16px;background:#fff;color:var(--texto);
  font-weight:900;font-size:20px;padding:8px 14px;-webkit-transition:transform .1s;transition:transform .1s}
.op:active{transform:scale(.94)}
.op.certa{border-color:#15a34a;background:#e7f8ee;color:#0d7736}
.op.erro{border-color:#e0562f;background:#fdeee9}
/* a opção que é uma FRASE (a definição, o porquê): texto corrido, alinhado à
   esquerda, largura cheia — frase centralizada em caixinha não se lê */
.op.frase{display:block;width:100%;max-width:420px;text-align:left;font-size:clamp(14px,3.7vw,17px);
  font-weight:700;line-height:1.35;letter-spacing:0;min-height:52px}
.op.curta{font-size:clamp(15px,4vw,19px);letter-spacing:.5px}
/* a opção COM figura */
.op.figbt{display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:96px;min-height:112px;padding:8px 10px}
.op.figbt .figop{display:block;width:auto;height:clamp(56px,14vw,80px);max-width:100%;object-fit:contain}
.rotop{font-weight:800;font-size:clamp(11px,2.9vw,13px);color:var(--texto2);letter-spacing:.4px;
  line-height:1.1;word-break:break-word}
/* ⚠️ A LEGENDA SECRETA. `visibility` e não `display`: o espaço fica guardado,
   então a folha não pula quando a palavra aparece no acerto. */
.segredo{visibility:hidden}
.segredo.revelado{visibility:visible;-webkit-animation:aparece .35s;animation:aparece .35s}
@-webkit-keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.figsil{display:flex;flex-direction:column;align-items:center;gap:4px;margin:2px 0 6px}
.chamlin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.chamlin b{font-size:clamp(15px,4vw,19px);color:var(--texto2);letter-spacing:.5px}

/* ---- marcar VÁRIAS certas (folha 1, da d18: "marque com x as corretas") ---- */
.marcax{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:10px}
.lx{display:flex;align-items:center;gap:12px;min-height:56px;border:3px solid #e6dbd1;border-radius:16px;
  background:#fff;padding:8px 14px;font-weight:700;font-size:clamp(14px,3.7vw,17px);color:var(--texto);
  width:100%;max-width:430px;text-align:left;line-height:1.3}
.lx .cx{width:34px;height:34px;border:3px solid #b3a294;border-radius:8px;display:inline-flex;align-items:center;
  justify-content:center;font-size:24px;font-weight:900;color:var(--cor);flex:none}
.lx.marcada{border-color:var(--cor);background:var(--corclara)}
.lx.marcada .cx{border-color:var(--cor)}
.lx.certa{border-color:#15a34a;background:#e7f8ee}
.lx.certa .cx{border-color:#15a34a;color:#15a34a}
.lx.errada{border-color:#e0562f;background:#fdeee9}

.alvonome.cheia{border-style:solid;border-color:#15a34a;background:#e7f8ee;color:#0d7736}
.banconome{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 10px 10px}
.etiq{min-height:46px;padding:8px 14px;border:3px dashed #e6dbd1;border-radius:12px;background:#fff;
  font-weight:900;font-size:clamp(13px,3.6vw,17px);color:var(--texto3);cursor:pointer;letter-spacing:.5px;
  -ms-touch-action:none;touch-action:none}
.etiq.marcada{border-style:solid;border-color:var(--cor);background:var(--corclara)}
.etiq.usada{opacity:.32;pointer-events:none;border-style:solid}
.etiq.puxada{opacity:.35}

/* ---- juntar as sílabas numeradas (folha 5, da d18 item 4) ---- */
.tabsil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 10px 6px}
.tsc{border:2px solid #e6dbd1;border-radius:10px;background:#fff;text-align:center;padding:5px 2px;
  min-height:46px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.tsc .tsn{font-size:11px;font-weight:800;color:#b3a294;display:block;line-height:1}
/* ⚠️ tinta PRÓPRIA, não o token do fundo da atividade: a célula pinta o
   próprio fundo, então quem decide a cor da letra é ela (portão 4c). */
.tsc .tss{font-size:clamp(13px,3.6vw,18px);font-weight:900;color:#4a3d33;display:block;letter-spacing:.5px}
.tsc.usada{background:var(--corclara);border-color:var(--cor)}
.tsc:active{-webkit-transform:scale(.94);transform:scale(.94)}
.montada{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center;margin:6px 0}
.mped{font-weight:900;font-size:clamp(17px,4.6vw,24px);color:#0d7736;background:#e7f8ee;border:2px solid #15a34a;
  border-radius:10px;padding:6px 10px;display:block}
.montada .vazio{font-weight:900;color:#c9bcb0;font-size:clamp(15px,4vw,19px)}

/* ---- ligar (folhas 8 e 22) ---- */
.ligar{position:relative;display:flex;gap:clamp(30px,10vw,96px);justify-content:space-between;margin:14px 6px}
.ligar .col{display:flex;flex-direction:column;gap:14px;flex:1 1 0;min-width:0}
.linhas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ponta{border:3px solid #e6dbd1;border-radius:16px;background:#fff;height:92px;display:flex;align-items:center;
  /* flex-wrap: com figura + palavra comprida (ENSOLARADO a 320 px) a figura era
     empurrada para fora da caixa pela esquerda; embrulhando, ela sobe e a palavra
     fica embaixo (medido pelo leiaute_mao, _sinon2 folha 3) */
  flex-wrap:wrap;justify-content:center;font-weight:900;font-size:clamp(13px,3.4vw,17px);letter-spacing:.4px;padding:6px;
  text-align:center;line-height:1.15;color:var(--texto2);
  -ms-touch-action:none;touch-action:none;-webkit-transition:border-color .15s,box-shadow .15s;
  transition:border-color .15s,box-shadow .15s}
.ponta img{width:auto;height:70px;max-width:100%;object-fit:contain}
@media (max-width:420px){ .ponta{height:auto;min-height:78px} .ponta img{height:58px} }
.ponta.marcada{border-color:var(--cor);box-shadow:0 0 0 4px rgba(176,86,42,.22)}
.ponta.feita{border-color:#15a34a;background:#e7f8ee}
.ponta.mostra{border-color:#f0b64a;box-shadow:0 0 0 4px rgba(240,182,74,.4)}
.ponta.treme{-webkit-animation:treme .4s;animation:treme .4s}
@-webkit-keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---- caça-palavras dos materiais (folha 9, da d02) ---- */
.diagrama{display:grid;gap:2px;margin:8px auto 4px;max-width:430px;touch-action:none;
  -webkit-user-select:none;user-select:none}
.dcel{min-width:0;aspect-ratio:1/1;min-height:30px;border:1px solid #eee0d4;border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:clamp(11px,3.1vw,16px);color:var(--texto3);cursor:pointer;padding:0}
.dcel.tracando{background:#ffe9d6;border-color:var(--cor)}
.dcel.achada{background:#e7f8ee;border-color:#15a34a;color:#0d7736}
.listamat{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 10px 4px}
.pmat{font-weight:900;font-size:clamp(12px,3.3vw,15px);color:var(--texto3);border:2px solid #e6dbd1;
  border-radius:10px;padding:5px 10px;background:#fff;letter-spacing:.5px}
.pmat.achada{border-color:#15a34a;background:#e7f8ee;color:#0d7736;text-decoration:line-through}

/* ---- classificar em colunas: lugares (11), vistas (19), cômodos (23) ---- */
.colunas{display:flex;gap:clamp(4px,1.6vw,10px);justify-content:center;margin:8px 8px 4px;flex-wrap:wrap}
.coluna{flex:1 1 28%;min-width:96px;max-width:200px;border:3px solid #e6dbd1;border-radius:14px;
  background:#fffdfb;padding:5px;min-height:112px;cursor:pointer}
.coluna.perto{border-color:var(--cor);background:var(--corclara)}
.coluna.erro{border-color:#e0562f;background:#fdeee9}
.ctit{font-weight:900;font-size:clamp(12px,3.2vw,15px);color:var(--texto2);margin-bottom:4px;
  border-bottom:2px solid #f0e6dd;padding-bottom:3px;display:flex;align-items:center;
  justify-content:center;gap:4px;flex-wrap:wrap;text-align:center;line-height:1.1}
.ctit .figmini{height:clamp(30px,7vw,40px)}
.cdentro{display:flex;flex-direction:column;gap:3px;align-items:center;min-height:56px}
.fdentro{font-weight:800;font-size:clamp(11px,3vw,14px);color:#0d7736;background:#e7f8ee;
  border-radius:8px;padding:3px 6px;display:block;max-width:100%;word-break:break-word;text-align:center}
.figmini{width:auto;height:clamp(34px,8vw,44px);max-width:100%;object-fit:contain;display:block}
.figbanco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 10px 10px}
.op.fig{padding:6px;min-width:96px;min-height:96px}
.op.fig .figmini{height:clamp(48px,12vw,64px)}
.op.fig.marcada{border-color:var(--cor);background:var(--corclara);
  -webkit-box-shadow:0 0 0 4px rgba(176,86,42,.18);box-shadow:0 0 0 4px rgba(176,86,42,.18)}
.op.fig.usada{opacity:.3;pointer-events:none}

/* ---- completar a lacuna (folha 15, da d23) ---- */
.frasel{font-size:clamp(15px,4vw,19px);font-weight:700;color:var(--texto2);line-height:1.7;
  text-align:center;margin:4px 6px 8px}
.lacuna{display:inline-block;min-width:96px;padding:2px 10px;border-bottom:4px solid var(--cor);
  color:var(--cor);font-weight:900;text-align:center}
.lacuna.cheia{border-bottom-color:#1f9d55;color:#1f9d55;background:#eafaf0;border-radius:8px 8px 0 0}

/* ---- cruzadinha (folha 16, da d08 reescrita) ---- */
.cruzenv{overflow-x:auto;margin:8px 0 4px}
.cruz{display:grid;gap:2px;margin:0 auto;width:-webkit-max-content;width:max-content}

/* ⚠️ O ALVO DA FOLHA 18 É INVISÍVEL ATÉ SER ACHADO, e isso é a folha inteira.
   A primeira versão pintava cada ponto com um anel branco por cima do desenho.
   Com três alvos já era discutível; com os dezessete da praça (uma fonte,
   quatro bancos, dez árvores e dois bebedouros) a figura virou um campo de
   bolhas — a criança tocava em qualquer anel e acertava sem OLHAR a praça, que
   é justamente o que a folha existe para medir. Agora o botão é só uma área de
   toque transparente do tamanho do dedo (52px, acima do piso de 44), e o anel
   verde só nasce quando ela acha. Achado por FOTO, 13/set/2026 — nenhum portão
   via, porque todos os alvos estavam lá, do tamanho certo, funcionando. */
.ponto{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  border:3px solid transparent;background:transparent;cursor:pointer;padding:0}
.ponto.certo{background:rgba(21,163,74,.55);border-color:#0d7736;
  -webkit-box-shadow:0 2px 8px rgba(0,0,0,.3);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ponto.errado{background:rgba(224,86,47,.5);border-color:#fff}
.ponto:active{-webkit-transform:scale(.9);transform:scale(.9)}
/* teclado: quem navega por TAB precisa ver onde está */
.ponto:focus{outline:3px solid #fff;outline-offset:-3px}

/* ================= A CAPA =================
   IDENTIDADE PRÓPRIA deste caderno (Marcos, 18/set/2026: "cada caderno precisa ter
   capa diferente, cor diferente, animações"). Cena: o motor da frase: as crianças em ação passam na esteira, e embaixo de cada uma o verbo que a nomeia (figuras recortadas da folha de papel d33).
   Gerado por _padrao/identidade_capa.py — editar LÁ, não aqui. Só CSS e PNG das
   folhas: nada de SVG, nada de emoji. @keyframes com sufixo Verbo4 (nome é global).
   Medido pelo portão 0b11 (_qa/identidade.py). */
.capa{position:relative;text-align:center;padding:18px 16px 24px;overflow:hidden;
  background:-webkit-linear-gradient(top,#d5ebe7 0%,#f4faf8 60%,#fff 100%);
  background:linear-gradient(180deg,#d5ebe7 0%,#f4faf8 60%,#fff 100%)}
.capa .ceu{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
.capa .titu,.capa .sub,.capa .chamada,.capa .cena{position:relative;z-index:1}
.capa h1.titu{margin:12px 0 4px;line-height:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;
  -webkit-perspective:600px;perspective:600px}
.capa .titu .cptpal{display:inline-flex;white-space:nowrap;gap:2px}
.capa .titu .lt{display:inline-block;font-size:clamp(22px,5.8vw,42px);font-weight:900;letter-spacing:0;
  color:#004c42;text-shadow:0 3px 0 #e0edeb,0 5px 10px rgba(0,0,0,.16);
  -webkit-animation:letraVerbo4 .7s both;animation:letraVerbo4 .7s both}
.capa .titu .cpesp{display:inline-block;width:14px}
@-webkit-keyframes letraVerbo4{from{opacity:0;-webkit-transform:translateX(-40px)}to{opacity:1;-webkit-transform:none}}
@keyframes letraVerbo4{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.capa .sub{font-weight:700;color:#2c3745;font-size:clamp(13px,3.6vw,18px);margin:6px 0 4px}
.capa .chamada{margin-top:14px;font-weight:700;color:#3a4658;font-size:clamp(13px,3.4vw,16px)}
.capa .cena{margin:14px auto 4px;max-width:620px}
.capa .capfig{width:auto;height:clamp(74px,19vw,124px);max-width:100%;object-fit:contain;display:block}
.capa .pl{display:block;font-weight:900;font-size:clamp(16px,4.6vw,26px);color:#fff;background:#00695c;border-radius:12px;
  padding:8px 14px;box-shadow:0 5px 0 #004c42;letter-spacing:.02em;white-space:nowrap}
.capa .rt{display:block;font-weight:900;font-size:clamp(12px,3.4vw,17px);color:#fff;background:#00695c;
  border-radius:9px;padding:2px 8px;margin-top:4px;letter-spacing:.03em;white-space:nowrap}
.capa .cena{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2.5vw,18px);flex-wrap:nowrap}
.capa .it{display:flex;flex-direction:column;align-items:center;-webkit-animation:sobeVerbo4 2.4s ease-in-out infinite;animation:sobeVerbo4 2.4s ease-in-out infinite}
.capa .esteira2{position:relative;max-width:620px;margin:0 auto;height:26px;border-radius:13px;background:#4a4a52;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.2);display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.capa .rolo{width:16px;height:16px;border-radius:50%;background:#e0edeb;border:3px solid #00695c;position:relative;
  -webkit-animation:giraVerbo4 1.4s linear infinite;animation:giraVerbo4 1.4s linear infinite}
.capa .rolo:after{content:"";position:absolute;left:50%;top:-1px;width:2px;height:6px;margin-left:-1px;background:#00695c}
@-webkit-keyframes sobeVerbo4{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-7px)}}
@keyframes sobeVerbo4{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@-webkit-keyframes giraVerbo4{to{-webkit-transform:rotate(360deg)}}
@keyframes giraVerbo4{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .capa *,.capa *:before,.capa *:after{-webkit-animation:none!important;animation:none!important}
}

/* ============================================================
   O CAMPO QUE CHAMA O TECLADO DO APARELHO.
   Ele mora EM CIMA da grade de casinhas e é praticamente invisível — mas
   continua sendo um campo de verdade, porque campo escondido não recebe foco

   ============================================================ */
#tecIn{position:absolute;z-index:5;border:0;background:transparent;color:transparent;

@-webkit-keyframes cai{to{transform:translateY(105vh) rotate(560deg);opacity:0}}
@keyframes cai{to{transform:translateY(105vh) rotate(560deg);opacity:0}}
.oculto{display:none!important}

  -webkit-transform:scale(1.1);transform:scale(1.1);
  -webkit-box-shadow:0 12px 26px rgba(50,30,15,.3);box-shadow:0 12px 26px rgba(50,30,15,.3)}
/* o cinto e o suspensório do `draggable="false"`: navegador antigo não olha o
   atributo, mas olha esta regra */
img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;user-drag:none}
.bt.pronto{min-height:48px;padding:0 22px;font-size:16px;margin:6px auto 0;display:block}

/* =========================================================================
   ANIMAÇÃO DAS FOLHAS — e a regra que manda é NADA ANIMA SEM FUNÇÃO.
     · os itens ENTRAM EM CASCATA → a criança vê que a folha tem começo e ordem;
     · a faixa do título DESLIZA → marca a troca de folha;
     · o acerto DÁ UM PULINHO e a opção certa BRILHA → resposta tátil;
     · o erro BALANÇA de leve → diz "de novo" sem dizer "errou".
   `prefers-reduced-motion` desliga tudo e a folha continua inteira.
   ========================================================================= */
.pagina.viva .item{-webkit-animation:entraItem .42s ease-out both;animation:entraItem .42s ease-out both}
.pagina.viva .item:nth-child(2){-webkit-animation-delay:.05s;animation-delay:.05s}
.pagina.viva .item:nth-child(3){-webkit-animation-delay:.10s;animation-delay:.10s}
.pagina.viva .item:nth-child(4){-webkit-animation-delay:.15s;animation-delay:.15s}
.pagina.viva .item:nth-child(5){-webkit-animation-delay:.20s;animation-delay:.20s}
.pagina.viva .item:nth-child(6){-webkit-animation-delay:.25s;animation-delay:.25s}
.pagina.viva .item:nth-child(n+7){-webkit-animation-delay:.30s;animation-delay:.30s}
@-webkit-keyframes entraItem{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:none}}
@keyframes entraItem{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pagina.viva .faixa{-webkit-animation:deslizaFaixa .4s cubic-bezier(.2,.9,.3,1) both;
  animation:deslizaFaixa .4s cubic-bezier(.2,.9,.3,1) both}
@-webkit-keyframes deslizaFaixa{from{opacity:0;-webkit-transform:translateX(-22px)}to{opacity:1;-webkit-transform:none}}
@keyframes deslizaFaixa{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.op.certa,.cartaocasa.escolhido{
  -webkit-animation:pulinho .4s cubic-bezier(.3,1.6,.5,1);animation:pulinho .4s cubic-bezier(.3,1.6,.5,1)}
@-webkit-keyframes pulinho{0%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.09)}100%{-webkit-transform:scale(1)}}
@keyframes pulinho{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.op.certa{position:relative;overflow:hidden}
.op.certa::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:38%;pointer-events:none;
  background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  -webkit-transform:skewX(-18deg);transform:skewX(-18deg);
  -webkit-animation:brilhoOp .55s .1s ease-out;animation:brilhoOp .55s .1s ease-out}
@-webkit-keyframes brilhoOp{from{left:-40%}to{left:112%}}

   373 px, e num celular de 360 a grade ficava CENTRADA e cortada dos DOIS

 "p10enun": "Agora quem faz é ele ou ela: uma pessoa só. Escolha a forma que combina.",

 "p12enun": "Leia a peça. Quem faz é um só, ou é mais de um? Repare no fim do verbo antes de escolher a gaveta.",

 "p14enun": "As duas frases são quase iguais: só o verbo muda. Toque na frase em que o verbo combina com quem faz.",
 "p15enun": "O verbo está entre parênteses, sem forma. Escreva a forma que combina com quem faz.",
 "p16enun": "Ligue cada pronome à forma do verbo que combina com ele. Diga os dois juntos em voz alta.",
 "p17enun": "Agora quem faz é um nome: o cachorro, os pássaros. Um só ou mais de um? Escolha o verbo que combina.",

 "p1enun": "Leia a frase. Uma das três palavras diz o que alguém faz: a ação. Qual é?",
 "p20enun": "Leia a notícia e toque nos verbos: as palavras que dizem o que cada um fez ou faz. Depois confira.",
 "p21enun": "Este texto tem erros. Toque nos verbos que não combinam com quem faz. Depois confira.",
 "p22enun": "O jornal da escola escreveu duas manchetes para cada notícia. Só uma está certa. Qual?",
 "p23enun": "Alguém falou. A palavra que falta diz quem falou e como. Qual verbo mostra a fala?",
 "p24enun": "As três opções são verbos de fala. Só uma combina com o jeito de falar: alto, baixinho, perguntando. Escolha.",
 "p25enun": "Alguns verbos mostram que alguém falou. Esses são os verbos de dizer. Separe: verbo de dizer, ou outro verbo?",
 "p26enun": "Cada fala pede um verbo de dizer. Ligue a fala ao verbo que mostra como ela foi dita.",
 "p27enun": "Leia a fala e o jeito de falar. Escreva o verbo de dizer que falta.",
 "p28enun": "Leia o diálogo e toque nos verbos de dizer: os que mostram quem falou e como. Depois confira.",
 "p29enun": "Ache na grade a forma do verbo que a pista pede: toque na primeira letra e depois na última.",
 "p2enun": "Em cada grupo há palavras de ação e palavras que são nomes de coisas. Marque só as ações e toque em Conferir.",
 "p30enun": "Agora o pronome muda: eu, nós, eles. Ache a forma que combina. Primeira letra, depois a última.",

 "p32enun": "Agora são os verbos de dizer. Leia a fala e escreva o verbo que mostra como ela foi dita.",
 "p33enun": "Em cima estão as formas do verbo. Puxe cada pronome até a forma que combina com ele, ou toque num e depois no outro.",
 "p34enun": "Agora o verbo é seu. Escreva um verbo que combine com quem faz. Vale qualquer um que caiba na frase.",
 "p35enun": "Você já sabe tudo isto. Agora os nomes: leve cada exemplo para a linha dele no cartaz.",
 "p3enun": "Leia cada palavra. Ela diz uma ação, ou é o nome de uma coisa? Leve para a gaveta certa.",
 "p4enun": "A palavra que diz a ação tem um nome: verbo. Você já achou treze. Agora ache o verbo de cada frase.",

/* ---------- som ---------- */
var AC = null;
function ac(){ try{ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); }catch(e){} return AC; }
function bip(f, dur, tipo, vol){
  var a = ac(); if(!a) return;
  try{
    var o = a.createOscillator(), g = a.createGain();
    o.type = tipo || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .13, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }catch(e){}
}
function sPasso(){ bip(560, .07, "triangle", .08); }
function sTecla(){ bip(760, .05, "square", .05); }
function sCerto(){ bip(680, .1, "sine", .12); setTimeout(function(){ bip(920, .14, "sine", .12); }, 95); }
function sErro(){ bip(190, .17, "sawtooth", .07); }
function sFesta(){ [523, 659, 784, 1047].forEach(function(f, i){ setTimeout(function(){ bip(f, .16, "sine", .12); }, i * 110); }); }

/* ---------- voz ---------- */
function chaveVoz(t){
  t = (t || "").replace(/\s+/g, " ").trim().toLowerCase();
  var h = 5381, i;
  for(i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function achaVoz(){
  try{
    var vs = window.speechSynthesis.getVoices();
    for(var i = 0; i < vs.length; i++) if((vs[i].lang || "").toLowerCase().indexOf("pt-br") === 0) return vs[i];
    for(i = 0; i < vs.length; i++) if((vs[i].lang || "").toLowerCase().indexOf("pt") === 0) return vs[i];
  }catch(e){}
  return null;
}
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function(){ vozPtBR = achaVoz(); };
function calar(){
  try{ if(_narr){ _narr.pause(); _narr.currentTime = 0; } }catch(e){}
  try{ window.speechSynthesis.cancel(); }catch(e){}
  var b = document.getElementById("bOuvir"); if(b) b.className = "zap ouvir";
}
function falarNavegador(t){
  if(!window.speechSynthesis) return;
  try{
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "pt-BR"; u.rate = .92; if(!vozPtBR) vozPtBR = achaVoz(); if(vozPtBR) u.voice = vozPtBR;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
var ultimaFala = null;
/* ⚠️ O MP3 É O PADRÃO E O SINTETIZADOR É A RESERVA — nunca o contrário. Se a
   criança ouvir voz de robô, o mp3 não chegou ao site: é defeito de entrega,
   não "jeito alternativo". O portão de voz mede isso. */
function falar(k){
  var t = FALAS[k]; if(!t) return;
  ultimaFala = k;
  if(!vozLigada) return;
  calar();
  var b = document.getElementById("bOuvir"); if(b) b.className = "zap ouvir tocando";
  function fim(){ var x = document.getElementById("bOuvir"); if(x) x.className = "zap ouvir"; }
  var key = chaveVoz(t);
  if(VOZOK[key]){
    if(!_narr){ _narr = new Audio(); _narr.preload = "auto"; }
    _narr.onended = fim; _narr.onerror = function(){ falarNavegador(t); setTimeout(fim, 2500); };
    _narr.src = "audio/vr_" + key + ".mp3";
    try{ _narr.currentTime = 0; }catch(e){}
    var p = _narr.play(); if(p && p["catch"]) p["catch"](function(){ fim(); });
    return;
  }
  falarNavegador(t); setTimeout(fim, Math.min(12000, 400 + t.length * 62));
}
/*SILMAP-INI*/var SILMAP = {};/*SILMAP-FIM*/
/* ⚠️⚠️ A SÍLABA SAI DA PALAVRA, NÃO DO NADA — e isto é a segunda vez que a casa
   paga por ele (set/2026 e 16/set/2026). O sintetizador de voz não lê SOM, lê
   PALAVRA: entregue "VA" sozinho e ele soletra "vê-á"; entregue "SA" e ele diz
   "esse-á". Não há truque de escrita que conserte isso — o remendo de escrever
   "sã" no lugar de "çã" conserta um caso e nunca fecha a família.
   O que funciona é o contrário: gravar a PALAVRA INTEIRA (que a voz pronuncia
   certo, porque é palavra de verdade), alinhar letra a letra com o
   `ctc-forced-aligner` e CORTAR a sílaba de dentro dela. Quem faz isso é o
   `_padrao/silabas_voz.py`, no `entregar.yml`, lendo o `silabas.json`.
   ⚠️ E NÃO HÁ FALA DE RESERVA POR SÍLABA: se o recorte faltar, ele diz a
      PALAVRA INTEIRA. Uma reserva sintetizada seria o próprio defeito
      voltando pela porta dos fundos — e calada, que é pior. */
/* ⚠️⚠️ O NOME DO ARQUIVO É SEM ACENTO; a PALAVRA guarda o acento. As duas
   coisas são diferentes e as duas importam: a voz só diz "sabão" direito se
   receber o til, mas `..._sb_sabão_0.mp3` atravessa git, zip, servidor de
   Pages e navegador, e em cada ponte o acento pode ser escrito com bytes
   diferentes (NFC × NFD). A MESMA regra está no `_padrao/silabas_voz.py` (que
   grava) e no `_qa/silabas.py` (que confere). Os três têm de concordar — se um
   discordar, a sílaba fica MUDA sem dar erro nenhum. */
function arqSilaba(w){
  w = String(w || "").toLowerCase();
  var de = "áàâãäéèêëíìîïóòôõöúùûüç", para = "aaaaaeeeeiiiiooooouuuuc", i, o = "";
  for(i = 0; i < w.length; i++){ var n = de.indexOf(w.charAt(i)); o += n > -1 ? para.charAt(n) : w.charAt(i); }
  return o.replace(/[^a-z0-9]/g, "");
}
function falarSilaba(palavra, i, silaba){
  if(!vozLigada) return;
  if(!palavra && silaba && SILMAP[silaba]){ palavra = SILMAP[silaba][0]; i = SILMAP[silaba][1]; }
  if(!palavra){ return; }
  calar();
  if(!_narr){ _narr = new Audio(); _narr.preload = "auto"; }
  _narr.onended = null;
  _narr.onerror = function(){ falar("pal_" + palavra); };
  _narr.src = "audio/vr_" + ("sb_" + arqSilaba(palavra) + "_" + i + ".mp3");
  try{ _narr.currentTime = 0; }catch(e){}
  var pr = _narr.play(); if(pr && pr["catch"]) pr["catch"](function(){ falar("pal_" + palavra); });
}
function falarDepois(k, ms){ setTimeout(function(){ falar(k); }, ms || 0); }

/* ⭐ 55 MINUTOS = A AULA. Dentro dela quem volta é a MESMA criança; passada a
   aula, quem senta ali é da outra turma e cairia no meio da viagem de um
   colega — por isso o convite expira sozinho. */
function carregar(){ try{
  var s = localStorage.getItem(CHAVE_LS); if(!s) return null;
  var o = JSON.parse(s);
  if(!o || !o.quando || Date.now() - o.quando > 55 * 60 * 1000 || !o.folha) return null;
  /* ⚠️ TRAVA 1 — O POTE GUARDADO AINDA EXISTE NESTE CADERNO?
     Sem isto, quem jogou ANTES de uma republicação volta com uma folha que não
     existe mais, o monta() estoura e a criança fica só com a faixa de cima — e
     por 55 minutos, que é a aula inteira. Foi o que o Marcos pegou em
     14/set/2026 ("só aparece a faixa de cima"; "anônima foi, a normal não"). */
  for(var i = 1; i <= NOMES.length; i++){
    if(!o.folha["p" + i]){ try{ localStorage.removeItem(CHAVE_LS); }catch(e2){} return null; }
  }
  return o;
}catch(e){ return null; } }
function tentativa(id, ok){ if(!ST.tent[id]) ST.tent[id] = {erros: 0, ok: false}; if(ok) ST.tent[id].ok = true; else ST.tent[id].erros++; salvar(); }
function rnd(n){ return Math.floor(Math.random() * n); }
function baralha(a){ var b = a.slice(), i, j, t; for(i = b.length - 1; i > 0; i--){ j = rnd(i + 1); t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function pega(pool, qtd){ return baralha(pool).slice(0, Math.min(qtd, pool.length)); }
function confete(n){
  var c = document.getElementById("confete"), cores = ["#00695c", "#f5b301", "#15a34a", "#1179bf", "#8b5cf6"], i;
  for(i = 0; i < n; i++){
    (function(i){
      var d = el("div", "cf");
      d.style.left = rnd(100) + "%"; d.style.top = "-20px";
      d.style.background = cores[rnd(cores.length)];
      d.style.animationDelay = (i * 26) + "ms";
      c.appendChild(d); setTimeout(function(){ if(d.parentNode) c.removeChild(d); }, 1900 + i * 26);
    })(i);
  }
}
